<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP Quest — A Missão Juliana</title>
<style>
:root{--navy:#101b3d;--blue:#4263eb;--gold:#ffd166;--mint:#73e0bd;--pink:#ff7b9c;--cream:#fff8e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101b3d,#253b79);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.game{width:min(960px,100%);border:4px solid #0b1025;border-radius:18px;overflow:hidden;background:#192955;box-shadow:0 18px 60px #0008}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px;background:#0d1631;border-bottom:3px solid #070d20}.logo{font-weight:1000;letter-spacing:1px;color:var(--gold);font-size:clamp(18px,3vw,28px)}.hud{font-size:13px;color:#dbe4ff;text-align:right}.screen{position:relative;min-height:490px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(#7ed9f7 0 56%,#b2efc4 56% 72%,#4bba83 72%);color:#17254b;overflow:hidden}.cloud{position:absolute;font-size:38px;opacity:.65;animation:float 7s ease-in-out infinite}.c1{top:35px;left:8%}.c2{top:72px;right:10%;animation-delay:-3s}.sun{position:absolute;right:8%;top:20px;width:58px;height:58px;border-radius:50%;background:#ffdc71;box-shadow:0 0 0 10px #ffdc7133}.panel{position:relative;z-index:2;width:min(650px,100%);padding:24px;border:4px solid #17254b;border-radius:14px;background:#fff8e8;box-shadow:8px 8px 0 #17254b;color:#17254b}.pixel{font-size:54px;line-height:1.2;filter:drop-shadow(3px 3px 0 #17254b);margin:0 0 8px}.panel h1{margin:4px 0 10px;font-size:clamp(25px,5vw,42px);line-height:1.05}.panel p{line-height:1.55;margin:10px 0}.tag{display:inline-block;background:#17254b;color:#fff8e8;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.6px}.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}.btn{border:3px solid #17254b;border-radius:9px;padding:11px 15px;background:var(--gold);color:#17254b;font-weight:850;cursor:pointer;box-shadow:3px 3px 0 #17254b;font-size:14px}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#dce7ff}.btn.good{background:var(--mint)}.btn:focus{outline:3px solid white;outline-offset:3px}.progress{height:10px;background:#0d1631}.bar{height:100%;width:0;background:var(--gold);transition:width .4s}.status{display:flex;justify-content:space-between;padding:10px 16px;background:#0d1631;font-size:12px;color:#dbe4ff}.dialogue{font-size:17px;font-weight:650}.choices{display:grid;gap:10px;margin-top:16px}.choices .btn{text-align:left;background:#e7edff}.choices .btn:hover{background:#d2ddff}.choices .btn.correct{background:#b5f4d9}.choices .btn.wrong{background:#ffd1da}.hint{font-size:13px;color:#536184}.character{font-size:48px}.ending{font-size:48px;animation:fly 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(12px)}}@keyframes fly{0%,100%{transform:translateX(-10px) rotate(-4deg)}50%{transform:translateX(15px) translateY(-12px) rotate(3deg)}}@media(max-width:600px){.screen{padding:14px;min-height:520px}.panel{padding:18px}.top{align-items:flex-start}.hud{max-width:45%}}
</style></head><body>
<div class="game"><div class="top"><div class="logo">★ VIP QUEST</div><div class="hud"><div id="phaseLabel">MISSÃO JULIANA</div><div>⭐ Pontos: <b id="score">0</b></div></div></div><div class="screen"><div class="sun"></div><div class="cloud c1">☁</div><div class="cloud c2">☁</div><div class="panel" id="panel" aria-live="polite"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status"><span id="statusLeft">TREINAMENTO DE ATENDIMENTO</span><span>ENTER = continuar</span></div></div>
<script>
const panel=document.getElementById('panel'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),phaseLabel=document.getElementById('phaseLabel'),statusLeft=document.getElementById('statusLeft');let score=0,step=0;
function addScore(n){score+=n;scoreEl.textContent=score}
function render(){bar.style.width=(step/5*100)+'%';const screens=[intro,investigation,empathy,boss,solution,victory];screens[step]();}
function buttons(items){return '<div class="btns">'+items.map(x=>`<button class="btn ${x.cls||''}" onclick="${x.action}">${x.label}</button>`).join('')+'</div>'}
function intro(){phaseLabel.textContent='PRÓLOGO';statusLeft.textContent='NOVA MISSÃO DESBLOQUEADA';panel.innerHTML=`<div class="pixel">🕹️ ✦ 🛫</div><span class="tag">JOGO DE TREINAMENTO</span><h1>VIP QUEST:<br>A MISSÃO JULIANA</h1><p>Juliana tentou entrar na Sala VIP, mas recebeu uma negativa. Ela precisa de uma orientação clara — e você é quem pode conduzir essa missão!</p><p><b>Objetivo:</b> investigar, acolher, verificar alternativas e concluir o atendimento sem deixar dúvidas.</p>${buttons([{label:'▶ INICIAR JOGO',action:'go(1)',cls:'good'}])}<p class="hint">Use o mouse ou toque nos botões. Não precisa instalar nada.</p>`}
function investigation(){phaseLabel.textContent='FASE 1 · INVESTIGAÇÃO';statusLeft.textContent='OBJETIVO: DESCOBRIR A CAUSA';panel.innerHTML=`<div class="character">🧑‍💻</div><span class="tag">FASE 1</span><h1>O que aconteceu?</h1><p class="dialogue">O sistema mostra que Juliana já utilizou os quatro acessos previstos no benefício para 2026. Qual é o próximo passo correto?</p><div class="choices"><button class="btn" onclick="answer(1,0,this)">A. Dizer que ela nunca mais poderá entrar.</button><button class="btn" onclick="answer(1,1,this)">B. Confirmar o limite usado e consultar as regras e alternativas disponíveis.</button><button class="btn" onclick="answer(1,0,this)">C. Prometer um acesso grátis para encerrar rápido.</button></div><p id="feedback" class="hint">Escolha uma resposta para avançar.</p>`}
function empathy(){phaseLabel.textContent='FASE 2 · ACOLHIMENTO';statusLeft.textContent='OBJETIVO: REDUZIR A INSATISFAÇÃO';panel.innerHTML=`<div class="character">💬</div><span class="tag">FASE 2</span><h1>Primeiro, acolher</h1><p class="dialogue">Juliana está frustrada: “Eu preciso usar a Sala VIP ainda este mês! Ninguém me explicou isso!”</p><p>Qual frase demonstra empatia sem prometer algo que ainda não foi confirmado?</p><div class="choices"><button class="btn" onclick="answer(2,0,this)">A. “As regras são essas. Não há o que fazer.”</button><button class="btn" onclick="answer(2,1,this)">B. “Entendo sua frustração. Vou verificar as condições do seu benefício e as alternativas possíveis para te orientar com clareza.”</button><button class="btn" onclick="answer(2,0,this)">C. “Calma, eu garanto que vou liberar sua entrada.”</button></div><p id="feedback" class="hint">Escolha a melhor resposta.</p>`}
function boss(){phaseLabel.textContent='CHEFÃO · NEGOCIAÇÃO';statusLeft.textContent='OBJETIVO: RESOLVER SEM CRIAR FALSAS EXPECTATIVAS';panel.innerHTML=`<div class="character">👾💢</div><span class="tag">CHEFÃO DESBLOQUEADO</span><h1>Juliana insatisfeita!</h1><p class="dialogue">“Eu não quero saber! Preciso entrar agora. O que você pode fazer por mim?”</p><p>Selecione a ação mais resolutiva.</p><div class="choices"><button class="btn" onclick="answer(3,0,this)">A. Repetir que os acessos acabaram e encerrar o chat.</button><button class="btn" onclick="answer(3,1,this)">B. Consultar as regras, verificar se há acesso adicional pago ou outra opção elegível e explicar o resultado.</button><button class="btn" onclick="answer(3,0,this)">C. Recomendar uma nova contratação sem conferir se libera acesso imediato.</button></div><p id="feedback" class="hint">Derrote o chefão com clareza e responsabilidade.</p>`}
function solution(){phaseLabel.textContent='FASE 4 · SOLUÇÃO';statusLeft.textContent='OBJETIVO: CONFIRMAR OS PRÓXIMOS PASSOS';panel.innerHTML=`<div class="character">🗂️✅</div><span class="tag">FASE 4</span><h1>Fechamento completo</h1><p>Você verificou as condições e explicou a alternativa que realmente está disponível. O que deve fazer antes de concluir o ticket?</p><div class="choices"><button class="btn" onclick="answer(4,0,this)">A. Encerrar imediatamente para reduzir o TMA.</button><button class="btn" onclick="answer(4,1,this)">B. Recapitular a solução, esclarecer dúvidas, confirmar os próximos passos e registrar o atendimento.</button><button class="btn" onclick="answer(4,0,this)">C. Garantir que a cliente ficará satisfeita sem confirmar se entendeu.</button></div><p id="feedback" class="hint">Escolha como finalizar a missão.</p>`}
function victory(){phaseLabel.textContent='MISSÃO CONCLUÍDA';statusLeft.textContent='RESULTADO: QUALIDADE + AGILIDADE';bar.style.width='100%';panel.innerHTML=`<div class="ending">✈️</div><span class="tag">TELA DE VITÓRIA</span><h1>PARABÉNS, JOGADOR!</h1><p>Você concluiu a Missão Juliana usando investigação, empatia, análise das alternativas e fechamento claro.</p><p><b>Pontuação final: ${score}/4 estrelas</b></p><p>O objetivo não é apenas encerrar o ticket: é resolver ou esclarecer a demanda, registrar corretamente e evitar que a cliente precise voltar pelo mesmo motivo.</p>${buttons([{label:'↻ JOGAR NOVAMENTE',action:'restart()',cls:'good'}])}`}
function answer(current,correct,btn){const feedback=document.getElementById('feedback');const all=panel.querySelectorAll('.choices .btn');all.forEach(b=>b.disabled=true);if(correct){btn.classList.add('correct');feedback.textContent='✅ Correto! Você ganhou uma estrela.';addScore(1)}else{btn.classList.add('wrong');feedback.textContent='💡 Essa escolha pode gerar frustração ou criar uma promessa indevida. A resposta mais segura é verificar e explicar as opções confirmadas.';const correctBtn=Array.from(all).find(b=>b.getAttribute('onclick').includes(',1,this'));if(correctBtn)correctBtn.classList.add('correct')}const next=current===4?5:current+1;feedback.innerHTML+=' <br><button class="btn good" style="margin-top:12px" onclick="go('+next+')">CONTINUAR ▶</button>'}
function go(n){step=n;render()}function restart(){score=0;step=0;scoreEl.textContent='0';render()}document.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=panel.querySelector('.btn.good');if(b)b.click()}});render();
</script></body></html>
